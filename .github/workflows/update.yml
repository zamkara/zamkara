name: Daily System Info Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/neofetch.svg'
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.select.outputs.image }}
      install: ${{ steps.select.outputs.install }}
      fallback: ${{ steps.select.outputs.fallback }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select container for selected distro
        id: select
        run: python3 .github/scripts/select_container.py

  update-readme:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.setup.outputs.image }}
    env:
      GITHUB_OS_FALLBACK: ${{ needs.setup.outputs.fallback }}
    permissions:
      contents: write
    steps:
      - name: Install required packages
        run: ${{ needs.setup.outputs.install }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update script
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/
          git diff --staged --quiet || (git commit -m "chore: update system info & uptime" && git push)
